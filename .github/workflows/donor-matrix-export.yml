name: donor-matrix-export

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Repository to run export in (owner/repo)"
        required: true
        default: "kosoymiki/wcp-runtime-lanes"
      target_ref:
        description: "Branch/tag"
        required: true
        default: "main"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout aesolator tools
        uses: actions/checkout@v4
        with:
          path: aesolator-tools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run donor export bundle
        shell: bash
        run: |
          mkdir -p tools docs
          cp -f aesolator-tools/tools/termux_export_donor_matrix.sh tools/
          cp -f aesolator-tools/tools/generate_donor_class_matrix.py tools/
          cp -f aesolator-tools/tools/audit_donor_class_matrix.py tools/
          cp -f aesolator-tools/tools/build_24_donor_batch_plan.py tools/
          cp -f aesolator-tools/tools/apply_24_donor_batch.py tools/
          cp -f aesolator-tools/tools/raw_donor_intake_scan.py tools/
          cp -f aesolator-tools/tools/apply_raw_manifest_batch.py tools/
          cp -f aesolator-tools/tools/donor_sources_2026_05_04.json tools/
          chmod +x tools/termux_export_donor_matrix.sh
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          bash tools/termux_export_donor_matrix.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out/ci_donor_export"

      - name: Upload donor export artifact
        uses: actions/upload-artifact@v4
        with:
          name: donor-export-bundle
          path: |
            out/ci_donor_export/**
            out/ci_donor_export.tar.gz
            docs/DONOR_CLASS_SWEEP_MATRIX_2026-05-04.md
            docs/DONOR_CLASS_SWEEP_AUDIT_2026-05-04.md
            docs/DONOR_24_BATCH_PLAN_2026-05-04.md
            docs/DONOR_24_APPLY_REPORT_2026-05-04.md
            docs/DONOR_24_RAW_INTAKE_REPORT_2026-05-04.md
          if-no-files-found: warn
